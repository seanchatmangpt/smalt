# dod.yaml — POSH v26.10.30 wave: machine-readable Definition of Done (single source).
#
# Every ALIVE claim of the wave as a requirement row: id, claim, gate command,
# expected exit, receipt path. Status vocabulary:
#   alive   — a gate command exists and is claimed to run green; the reader
#             runs it and records the real result.
#   planned — declared but not yet gated (DPMO campaign, MSA, SPC, sidecar
#             healthz falsifier, tollgates T2-T5). Never a claim of ALIVE;
#             the reader reports these SKIP (loud, with reason "planned").
#
# Seeded from: POSH-001..010 tickets, gaps/INDEX.md status lines, tollgates
# T1-T5 (dfcharter/define.md §5), and the landed lanes' receipts
# (docs/jira/posh/v26.10.30/receipts/).
