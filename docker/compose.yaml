# Burn-suite services: four concurrent burn lanes over one image.
#
# Each service is its own container/network namespace, so the private
# six-listener port blocks used by scripts/stress/* never collide on the
# host. CPU dials are per-service `cpus` limits, dialed so the four lanes
# together stay inside one mid-size dev machine.
#
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml up burn-a burn-b burn-c burn-d

x-smalt-common: &smalt-common
  image: smalt-burn:latest
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: test
    additional_contexts:
      ash_r2rml: ../../ash_r2rml
      ash_graphlaw: ../../ash_graphlaw
      ggen_igniter: ../../ggen_igniter
  environment:
    MIX_ENV: test
    SMALT_CERT_DIR: /smalt/.smalt/tls
    SSL_CERT_FILE: /smalt/.smalt/tls/ca-cert.pem
  working_dir: /smalt
  init: true
  healthcheck:
    # Burn lanes boot a private substrate on EPHEMERAL ports — there is no
    # fixed listener to dial, so the healthcheck is BEAM liveness: PID 1
    # alive and a beam scheduler process running. (Pattern source:
    # docker/compose.smalt.yml, which dials its fixed 9443 listener.)
    test: ["CMD", "bash", "-c", "kill -0 1 && pgrep -f 'beam.smp' >/dev/null"]
    interval: 30s
    timeout: 5s
    start_period: 20s

services:
  # Lane A — sustained soak: 25-min mixed traffic vs private substrate.
  burn-a:
    <<: *smalt-common
    command: ["python3", "scripts/stress/soak.py"]
    cpus: 2.0
    mem_limit: 4g
    networks: [burn-net-a]

  # Lane B — chaos: kill-under-load, listen-queue fill, recovery timing.
  burn-b:
    <<: *smalt-common
    command: ["python3", "scripts/stress/chaos_kill.py"]
    cpus: 1.5
    mem_limit: 3g
    networks: [burn-net-b]

  # Lane C — stress test tier: Class-B faces via the :stress tag.
  burn-c:
    <<: *smalt-common
    command: ["mix", "test", "--include", "stress"]
    cpus: 2.0
    mem_limit: 4g
    networks: [burn-net-c]

  # Lane D — boot burn: repeated full app boot/exit cycles.
  burn-d:
    <<: *smalt-common
    command:
      - bash
      - -c
      - >-
        for i in $$(seq 1 $${SMALT_BOOT_BURN_ITERS:-20}); do
        mix run -e 'Application.ensure_all_started(:smalt); Process.sleep(250)'
        || exit 1;
        echo "[boot-burn] iter $$i ok";
        done
    environment:
      MIX_ENV: test
      SMALT_CERT_DIR: /smalt/.smalt/tls
      SSL_CERT_FILE: /smalt/.smalt/tls/ca-cert.pem
      SMALT_BOOT_BURN_ITERS: 20
    cpus: 1.0
    mem_limit: 2g
    networks: [burn-net-d]

# Each burn lane gets its OWN compose network: the lanes are independent
# network namespaces (private ephemeral-port substrates), never siblings on
# a shared fabric — no cross-lane DNS discovery exists or should exist.
networks:
  burn-net-a: {}
  burn-net-b: {}
  burn-net-c: {}
  burn-net-d: {}
