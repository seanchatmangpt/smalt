# Loopback-only hardened local deployment of the smalt substrate.
# Run from the repo root:  docker compose -f docker/compose.smalt.yml up --build
#
# Sibling path deps (../ash_graphlaw, ../ggen_igniter, ../ex4pm) are injected
# as extra build contexts; see the build section and docker/README.md.

services:
  smalt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        ash_graphlaw: ../ash_graphlaw
        ggen_igniter: ../ggen_igniter
        ex4pm: ../ex4pm
    image: smalt:local
    container_name: smalt
    ports:
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:5673:5673"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9443"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    stop_grace_period: 30s
    read_only: true
