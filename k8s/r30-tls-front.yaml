# r30 TLS front — terminates HTTPS for the courtroom in-cluster names with
# the smalt-CA-signed r30 leaf (P09 trust chain). The driver pod's browser
# trusts the smalt CA baked into the courtroom-driver image; production
# validators only, zero TLS bypass anywhere.
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: r30-identity-tls
  namespace: smalt
data:
  tls.crt: 
  tls.key: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r30-tls-front
  namespace: smalt
spec:
  replicas: 1
  selector:
    matchLabels: { app: r30-tls-front }
  template:
    metadata:
      labels: { app: r30-tls-front }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - { containerPort: 443, name: https }
          volumeMounts:
            - { name: certs, mountPath: /etc/nginx/certs, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
      volumes:
        - name: certs
          secret:
            secretName: r30-identity-tls
        - name: conf
          configMap:
            name: r30-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: r30-front
  namespace: smalt
spec:
  selector: { app: r30-tls-front }
  ports:
    - { name: https, port: 443, targetPort: 443 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: r30-nginx-conf
  namespace: smalt
data:
  default.conf: |
    # TLS termination for the courtroom identity topology (P09).
    server {
      listen 443 ssl;
      ssl_certificate     /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;
      # courtroom-web origin (P01/P04/P05/P06 surface)
      location /web/ {
        proxy_pass http://courtroom-web.default.svc.cluster.local:3000/;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
      }
      # SAML IdP face (P01/P02 sign-in + SLO)
      location /idp/ {
        proxy_pass http://courtroom-smalt.default.svc.cluster.local:19445/;
        proxy_set_header X-Forwarded-Proto https;
      }
      # OIDC face (P03)
      location /oidc/ {
        proxy_pass http://courtroom-smalt.default.svc.cluster.local:9446/;
        proxy_set_header X-Forwarded-Proto https;
      }
    }
