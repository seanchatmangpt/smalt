# courtroom-web.yaml — lane KIND-E2E (v26.10.29): @courtroom/web (Next.js
# standalone) as the public browser origin of the in-cluster proof.
#
# Every flow URL the driver touches is this origin: / (sign-in page),
# /api/* (proxied to courtroom-api with cookies/origin forwarded —
# apps/web/src/lib/backend.ts), /saml/acs (proxied, navigation mode).
# CANONICAL_ORIGIN/REDIRECT_HOSTS unset -> canonical-host middleware is
# pass-through (no 308 redirects).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courtroom-web
  namespace: default
  labels:
    app: courtroom-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: courtroom-web
  template:
    metadata:
      labels:
        app: courtroom-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: courtroom-web:kind
          imagePullPolicy: Never
          env:
            - name: BACKEND_URL
              value: http://courtroom-api.default.svc.cluster.local:8080
          ports:
            - { name: http, containerPort: 3000 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: courtroom-web
  namespace: default
spec:
  selector:
    app: courtroom-web
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30090 }
  type: NodePort
