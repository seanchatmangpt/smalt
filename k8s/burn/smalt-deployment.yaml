# smalt burn deployment — Phase 4 compact-cluster orchestration blueprint.
#
# Re-authored per Phase 4 spec:
#
#   1. ZERO sidecars: one container per pod. Storage (DETS mirrors),
#      cache, and pubsub resolve in-process (Smalt.Store /
#      Smalt.StoreTables / messaging supervisors). No redis/rabbitmq/
#      envoy/nginx sidecars are referenced.
#   2. Native BEAM discovery: RELEASE_DISTRIBUTION=name +
#      RELEASE_NODE=smalt@<pod>.smalt-headless.default.svc.cluster.local.
#      The image's release target CMD is /app/_release/bin/smalt start
#      (docker/Dockerfile release stage), which honors the RELEASE_* env
#      contract natively. There is no libcluster dependency in mix.exs,
#      so discovery rides the release's own name distribution over the
#      headless Service DNS (k8s/burn/smalt-services.yaml, clusterIP:
#      None): peers resolve the headless name to pod IPs and connect via
#      EPMD (4369) + a pinned dist range 9000-9009 (ERL_AFLAGS below) so
#      NetworkPolicies stay mechanical.
#   3. Security context: runAsNonRoot, readOnlyRootFilesystem, all
#      capabilities dropped, /tmp on tmpfs (the only writable path the
#      runtime needs; SMALT_DATA_DIR lives under it).
#   4. Probes: /metadata/endpoints on 9443 is the only auth-exempt HTTP
#      surface (lib/smalt/auth/bearer.ex @exempt_exact + arm router
#      GET /metadata/endpoints). Readiness = listener + router up;
#      liveness = same endpoint, looser thresholds. Documented gap in
#      k8s/README.md: no /health endpoint yet reflecting
#      scheduler-reduction capacity + state-engine integrity — that is
#      the /health endpoint lane's seam.
#   5. 3 replicas, required pod anti-affinity, resource bounds, and the
#      subject identity carried as label + annotation. Pods cannot read
#      image labels, so SUBJECT_SHA is parameterized: __SUBJECT_SHA__ is
#      substituted (sed) from the image contract (org.smalt.subject
#      label / SMALT_BURN_SUBJECT_SHA env, baked by
#      scripts/build_burn_image.sh) at deploy time. Never deploy with the
#      placeholder unsubstituted — that is invalid subject identity.
#
# Preceded by: the 2-replica mix-run --no-halt deployment with tcpSocket
# probes (replaced wholesale).

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smalt-burn
  namespace: default
  labels:
    app: smalt-burn
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smalt-burn
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smalt-burn
        # Subject identity: substituted from the image contract at deploy
        # time (never hand-edit the substituted form).
        smalt.dev/subject-sha: "__SUBJECT_SHA__"
        smalt.dev/deployment-phase: "phase4-compact-cluster"
    annotations:
      smalt.dev/subject-sha: "__SUBJECT_SHA__"
    spec:
      # Anti-affinity: spread replicas across nodes (required during
      # scheduling).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: smalt-burn
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      terminationGracePeriodSeconds: 30
      containers:
        - name: smalt
          # Release-stage image (docker/Dockerfile `FROM deps AS release`,
          # CMD ["/app/_release/bin/smalt", "start"]). NOT the mix-run burn
          # target: BEAM name distribution requires the release boot scripts.
          image: smalt:local
          imagePullPolicy: Never
          command: ["/app/_release/bin/smalt", "start"]
          env:
            - name: RELEASE_DISTRIBUTION
              value: name
            - name: RELEASE_NODE
              value: smalt@$(POD_NAME).smalt-headless.default.svc.cluster.local
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Inter-node cookie: required for BEAM distribution. Inline for
            # the kind burn cluster; a real cluster must source it from a
            # Secret (documented in k8s/README.md).
            - name: RELEASE_COOKIE
              value: smalt-burn-cookie-phase4
            # Pin the Erlang distribution port range so peer reachability +
            # any NetworkPolicy stays mechanical.
            - name: ERL_AFLAGS
              # yamllint disable-line rule:line-length
              value: "-kernel inet_dist_listen_min 9000 -kernel inet_dist_listen_max 9009"
            # Release port contract (rel/env.sh.e).
            - name: SMALT_ARM_PORT
              value: "9443"
            - name: SMALT_EGRESS_PORT
              value: "8443"
            - name: SMALT_AMQP_PORT
              value: "5672"
            - name: SMALT_EVENT_HUBS_PORT
              value: "5673"
            # Bind all interfaces so the headless-DNS node name is
            # dialable from peers (BEAM default binds loopback only).
            - name: SMALT_BIND_ALL_INTERFACES
              value: "true"
            - name: SMALT_BIND_IP
              value: "0.0.0.0"
            # Writable state under the tmpfs-backed /tmp; DETS mirrors +
            # rolling counters land here (in-process storage, no sidecar).
            - name: SMALT_DATA_DIR
              value: /tmp/smalt-data
          ports:
            - name: arm-mgmt
              containerPort: 9443
            - name: data-egress
              containerPort: 8443
            - name: amqp-sb
              containerPort: 5672
            - name: eh
              containerPort: 5673
            - name: epmd
              containerPort: 4369
            - name: erl-dist
              containerPort: 9000
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /metadata/endpoints
              port: arm-mgmt
            initialDelaySeconds: 10
            periodSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /metadata/endpoints
              port: arm-mgmt
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        # tmpfs scratch for /tmp: the only writable path (readOnlyRootFilesystem
        # requirement); memory-backed, cleared on pod restart.
        - name: tmp
          emptyDir:
            medium: Memory
