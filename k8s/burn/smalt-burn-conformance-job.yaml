apiVersion: batch/v1
kind: Job
metadata:
  name: smalt-burn-conformance
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        job: smalt-burn-conformance
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: build-volume
        emptyDir: {}
      - name: beam4pm-volume
        hostPath:
          path: /beam4pm
          type: Directory
      - name: xaas-volume
        hostPath:
          path: /xaas
          type: Directory
      - name: burn-evidence-volume
        hostPath:
          path: /burn-evidence
          type: Directory
      containers:
      - name: conformance-runner
        image: smalt:local
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        command:
        - elixir
        - /burn-evidence/in_container_conformance.exs
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: build-volume
          mountPath: /smalt/_build
        - name: beam4pm-volume
          mountPath: /beam4pm
          readOnly: true
        - name: xaas-volume
          mountPath: /xaas
          readOnly: true
        - name: burn-evidence-volume
          mountPath: /burn-evidence
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
_changed: true
