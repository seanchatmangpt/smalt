apiVersion: batch/v1
kind: Job
metadata:
  name: smalt-sovereign-midnight-burn
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        job: smalt-sovereign-midnight-burn
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: build-volume
        emptyDir: {}
      - name: burn-evidence-volume
        hostPath:
          path: /burn-evidence
          type: Directory
      containers:
      - name: test-runner
        image: smalt:local
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        command:
        - mix
        - test
        - /burn-evidence/sovereign_midnight_test.exs
        env:
        - name: MIX_ENV
          value: test
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: build-volume
          mountPath: /smalt/_build
        - name: burn-evidence-volume
          mountPath: /burn-evidence
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
_changed: true
