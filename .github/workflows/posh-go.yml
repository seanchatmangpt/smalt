# posh-go.yml — Go CI for posh/ and the terraform provider adapter (lane 10).
#
# Two independent jobs over real artifacts, no secrets:
#   - posh: gofmt cleanliness, go vet, -race tests, and a static build whose
#     `file` output proves CGO_ENABLED=0 static linkage.
#   - provider: gofmt, vet, tests, then `go build` the provider binary and
#     upload it as a 7-day artifact.
#
# Live tier (job `live`): boots the smalt substrate with the ci.yml pattern
# (setup-beam, mix deps.get, mix run --no-halt) and runs the provider's live
# tests with TFPOSHT_LIVE=1 against it. Fail-closed: if the substrate does not
# bind 9443 within 120s the job fails loudly (no silent skip).
name: posh-go

on:
  push:
    branches: [main]
    paths:
      - 'posh/**'
      - 'adapters/terraform-provider-smalt/**'
      - '.github/workflows/posh-go.yml'
  pull_request:
    paths:
      - 'posh/**'
      - 'adapters/terraform-provider-smalt/**'
      - '.github/workflows/posh-go.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posh
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go (from posh/go.mod)
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.5.0
        with:
          go-version-file: posh/go.mod
          cache-dependency-path: posh/go.sum

      - name: gofmt clean
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -l flagged:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: Static build + file check
        run: |
          make build
          file bin/posh | grep -i 'statically linked'

  provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/terraform-provider-smalt
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go (from adapters/terraform-provider-smalt/go.mod)
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.5.0
        with:
          go-version-file: adapters/terraform-provider-smalt/go.mod
          cache-dependency-path: adapters/terraform-provider-smalt/go.sum

      - name: gofmt clean
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -l flagged:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (TFPOSHT_LIVE unset; live tier skipped)
        run: go test ./...

      - name: Build provider binary
        run: go build -trimpath -o terraform-provider-smalt .

      - name: Upload provider binary (7 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-provider-smalt
          path: adapters/terraform-provider-smalt/terraform-provider-smalt
          retention-days: 7

  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Elixir (substrate, ci.yml pattern)
        uses: erlef/setup-beam@988e02bfe678367a02564f65ca2e37726dc0268f # v1.9.0
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1.2"

      - name: Setup Go (from adapters/terraform-provider-smalt/go.mod)
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.5.0
        with:
          go-version-file: adapters/terraform-provider-smalt/go.mod
          cache-dependency-path: adapters/terraform-provider-smalt/go.sum

      - name: Install substrate dependencies
        run: mix deps.get

      - name: Boot substrate (background) and wait for the ARM face
        run: |
          mix run --no-halt > /tmp/smalt-substrate.log 2>&1 &
          SMALT_PID=$!
          echo "SMALT_PID=$SMALT_PID" >> "$GITHUB_ENV"
          code=""
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9443/metadata/endpoints || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "--- substrate log (tail) ---" >&2
            tail -100 /tmp/smalt-substrate.log >&2
            echo "FATAL: smalt substrate never returned 200 on :9443/metadata/endpoints within 120s (last=$code)" >&2
            kill "$SMALT_PID" 2>/dev/null || true
            exit 1
          fi

      - name: Live provider tests (TFPOSHT_LIVE=1)
        working-directory: adapters/terraform-provider-smalt
        env:
          TFPOSHT_LIVE: "1"
        run: go test -count=1 ./...
