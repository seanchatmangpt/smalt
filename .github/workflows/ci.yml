name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  elixir:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.18-27-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.18-27-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Unit tests (residual tier)
        run: mix test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # T3: real SDK clients against a live substrate.
      # RETIRED with the v26.10.19 reset (64f6099): test/sdk-smoke deleted.
      # TODO(V261019-08): uncomment + repoint to the verification/ts SDK
      # smoke entry point when it lands. Commented out (never silently
      # green): the job simply no longer claims SDK coverage.
      # - name: SDK smoke tier
      #   run: |
      #     mix run --no-halt &
      #     SMALT_PID=$!
      #     for _ in $(seq 1 30); do
      #       nc -z 127.0.0.1 9443 && break
      #       sleep 1
      #     done
      #     nc -z 127.0.0.1 9443 || { echo "substrate never bound 9443" >&2; exit 1; }
      #     node verification/ts/run.mjs
      #     kill $SMALT_PID

      # T4: terraform fixture. `terraform plan` is only meaningful with the
      # substrate up, so this step boots the substrate (after doctor) before
      # planning; both plan and boot are gated — a failure fails the job.
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fixture tier
        run: |
          python3 scripts/doctor.py
          mix run --no-halt &
          SMALT_PID=$!
          for _ in $(seq 1 30); do
            nc -z 127.0.0.1 9443 && break
            sleep 1
          done
          nc -z 127.0.0.1 9443 || { echo "substrate never bound 9443" >&2; exit 1; }
          cd scripts/tf_fixtures
          terraform fmt -check -recursive
          terraform init -input=false
          terraform plan -input=false
          kill $SMALT_PID
